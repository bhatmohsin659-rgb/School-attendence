name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q SchoolAttendanceApp_APK_Ready.zip -d project

      - name: Find Gradle project
        run: |
          find project -name gradlew -type f
          find project -name build.gradle -o -name build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -n 1)
          if [ -n "$GRADLEW" ]; then
            chmod +x "$GRADLEW"
            cd "$(dirname "$GRADLEW")"
            ./gradlew assembleDebug
          else
            echo "ERROR: gradlew not found inside ZIP"
            exit 2
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: school-attendance-apk
          path: "project/**/build/outputs/apk/debug/*.apk"
